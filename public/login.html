<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Art on OBS - Login</title>
<style>
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #161616; color: #e2e2f0; font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .login-card {
    background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid #2c2c2c;
    width: 320px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  h2 { margin-bottom: 20px; font-size: 20px; color: #ffa755; }
  input[type="password"] {
    width: 100%; padding: 10px; background: #141414; border: 1px solid #2c2c2c;
    border-radius: 8px; color: #fff; text-align: center; font-size: 16px; margin-bottom: 15px;
    box-sizing: border-box; outline: none; transition: border-color 0.2s;
  }
  input[type="password"]:focus { border-color: #ffa755; }
  button {
    width: 100%; padding: 10px; border: none; background: #ffa755; color: #fff;
    font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: #e59344; }
  #error-msg { color: #f87171; font-size: 12px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<div class="login-card">
  <h2>🎛️ Control Panel Login</h2>
  <input type="password" id="pass-input" placeholder="Introduce la contraseña" autofocus>
  <button onclick="intentarLogin()">Entrar al Panel</button>
  <div id="error-msg"></div>
</div>

<script>
async function intentarLogin() {
  const password = document.getElementById('pass-input').value;
  const errorEl = document.getElementById('error-msg');
  errorEl.textContent = "";

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });

  const data = await res.json();
  if (res.ok && data.ok) {
    window.location.href = '/control.html'; // Redirección exitosa
  } else {
    errorEl.textContent = data.error || "Error al conectar";
  }
}

// Permitir entrar presionando Enter
document.getElementById('pass-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') intentarLogin();
});
</script>
</body>
</html>
