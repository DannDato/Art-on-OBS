<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DrawCast - Terminal Access</title>
<link rel="stylesheet" href="style/main.css">
</head>
<body class="login-page">

<div class="terminal-wrapper">
  <div class="terminal-header">
    <span class="header-left">DANNPROD // </span>
    <span class="header-right">v1.0.9</span>
  </div>

  <div class="login-card">
    <div class="title-container">
      <span class="lock-icon">🔒</span>
      <h2>ACCESO RESTRINGIDO</h2>
    </div>
    <div class="subtitle">Se requiere identificación para operaciones de transmisión.</div>
    
    <div class="input-label">CONTRASEÑA DE ACCESO</div>
    <input type="password" id="pass-input" placeholder="••••••••••••" autofocus>
    
    <button class="btn-authorize" onclick="intentarLogin()">
      AUTORIZAR 🛡️
    </button>
    
    <div class="card-footer">
      <span>ENCRIPTACIÓN: Activa</span>
      <span>Setvidor: daserv</span>
    </div>

    <div id="error-msg"></div>
  </div>

  <!-- <div class="external-buttons">
    <button class="btn-secondary">📋 RECOVERY</button>
    <button class="btn-secondary">🌐 NETWORK</button>
  </div> -->
</div>

<script>
async function intentarLogin() {
  const password = document.getElementById('pass-input').value;
  const errorEl = document.getElementById('error-msg');
  errorEl.textContent = "";

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });

  const data = await res.json();
  if (res.ok && data.ok) {
    window.location.href = '/control'; 
  } else {
    errorEl.textContent = data.error || "ERR: ACCESS DENIED";
  }
}

document.getElementById('pass-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') intentarLogin();
});
</script>
</body>
</html>
