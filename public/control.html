<!DOCTYPE html>
<html lang="es">
<head>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="shortcut icon" href="img/icon.ico" type="image/x-icon">
<meta charset="UTF-8">
<title>DrawCast | DannDato</title>
<link rel="stylesheet" href="style/main.css">
</head>
<body class="control-page">

<div id="sidebar">
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
      <path d="M3 13h8v8H3zm0-10h8v8H3zm10 0h8v8h-8zm0 10h8v8h-8z"/>
    </svg>
  </div>
  <div class="sidebar-sep"></div>

  <button class="tool-btn activo" id="tool-select" onclick="setTool('select')">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
      <path fill-rule="evenodd" d="M13.729 5.575c1.304-1.074 3.27-.146 3.27 1.544v9.762c0 1.69-1.966 2.618-3.27 1.544l-5.927-4.881a2 2 0 0 1 0-3.088l5.927-4.88Z" clip-rule="evenodd"/>
    </svg>
    <span class="tip">SELECT // MOVE</span>
  </button>
  
  <button class="tool-btn" id="tool-draw" onclick="setTool('draw')">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.779 17.779 4.36 19.918 6.5 13.5m4.279 4.279 8.364-8.643a3.027 3.027 0 0 0-2.14-5.165 3.03 3.03 0 0 0-2.14.886L6.5 13.5m4.279 4.279L6.499 13.5m2.14 2.14 6.213-6.504M12.75 7.04 17 11.28"/>
    </svg>
    <span class="tip">DRAW // PENCIL</span>
  </button>
  
  <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
      <path fill-rule="evenodd" d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12Zm5.757-1a1 1 0 1 0 0 2h8.486a1 1 0 1 0 0-2H7.757Z" clip-rule="evenodd"/>
    </svg>
    <span class="tip">ERASER</span>
  </button>

  <button class="tool-btn" id="tool-text" onclick="setTool('text')">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m8.874 19 6.143-14M6 19h6.33m-.66-14H18"/>
    </svg>
    <span class="tip">TEXT GENERATOR</span>
  </button>
  
  <button class="tool-btn" id="tool-image" onclick="triggerUpload()">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
      <path fill-rule="evenodd" d="M13 10a1 1 0 0 1 1-1h.01a1 1 0 1 1 0 2H14a1 1 0 0 1-1-1Z" clip-rule="evenodd"/>
      <path fill-rule="evenodd" d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12c0 .556-.227 1.06-.593 1.422A.999.999 0 0 1 20.5 20H4a2.002 2.002 0 0 1-2-2V6Zm6.892 12 3.833-5.356-3.99-4.322a1 1 0 0 0-1.549.097L4 12.879V6h16v9.95l-3.257-3.619a1 1 0 0 0-1.557.088L11.2 18H8.892Z" clip-rule="evenodd"/>
    </svg>
    <span class="tip">IMPORT IMAGE / GIF</span>
  </button>

  <div class="sidebar-sep"></div>

  <button class="guide-btn activo" id="guide-none" onclick="cambiarGuia('none')">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
    </svg>
    <span class="tip">DISABLE CANVA GUIDE</span>
  </button>

  <button class="guide-btn" id="guide-1" onclick="cambiarGuia('canva-guide.png')">
    <span>G1</span>
    <span class="tip">CANVA GUIDE 01</span>
  </button>

  <button class="guide-btn" id="guide-2" onclick="cambiarGuia('canva-guide2.png')">
    <span>G2</span>
    <span class="tip">CANVA GUIDE 02</span>
  </button>

  <button class="guide-btn" id="guide-3" onclick="cambiarGuia('canva-guide3.png')">
    <span>G3</span>
    <span class="tip">CANVA GUIDE 03</span>
  </button>

  <div class="sidebar-sep"></div>

  <button class="btn-danger" onclick="limpiarTodo()">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5v14m-6-8h6m-6 4h6m4.506-1.494L15.012 12m0 0 1.506-1.506M15.012 12l1.506 1.506M15.012 12l-1.506-1.506M20 19H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1Z"/>
    </svg>
    <span class="tip">PURGE CANVA DATA</span>
  </button>
  
  <div id="status" title="SYS_STATUS: ONLINE"></div>
</div>

<div class="terminal-watermark">
  <h1>DrawCast <span>// DannDato</span></h1>
</div>

<div id="canvas-wrap">
  <canvas id="canvas-main"></canvas>

  <img id="canvas-overlay" src="">

  <textarea id="text-input-el" rows="1"></textarea>
  <div id="drop-overlay">READY TO DECODE IMAGE 🖼️</div>
</div>

<div id="props">
  <div id="props-draw" class="prop-group">
    <h2>[01] PINCEL</h2>
    <div class="prop-row">
      <label>COLOR</label>
      <input type="color" id="draw-color" value="#EBEBEB">
    </div>
    <div class="prop-row">
      <label>GROSOR</label>
      <input type="range" id="draw-size" min="2" max="100" value="10">
      <span id="draw-size-val">8</span>
    </div>
    <button class="prop-btn sec" onclick="limpiarDibujo()">LIMPIAR TRAZOS</button>
  </div>

  <div id="props-text" class="prop-group">
    <h2>[02] CONFIG TEXTO</h2>
    <div class="prop-row">
      <label>COLOR</label>
      <input type="color" id="text-color" value="#ffffff">
    </div>
    <div class="prop-row">
      <label>TAMAÑO</label>
      <input type="number" id="text-size" value="56" min="12" max="200">
    </div>
  </div>

  <div id="props-select" class="prop-group">
    <h2>[03] OBJETO SELECCIONADO</h2>
    <button class="prop-btn danger" onclick="eliminarSeleccionado()">ELIMINAR OBJETO</button>
    <button class="prop-btn sec" onclick="deseleccionar()">DESELECCIONAR</button>
  </div>

  <div id="props-layers" class="prop-group">
    <div class="layers-head">
      <h2>[04] CAPAS</h2>
      <button id="layers-density-toggle" class="layers-density-toggle" type="button" aria-pressed="false">MODO: AMPLIO</button>
    </div>
    <button id="create-draw-layer-btn" class="prop-btn sec" type="button">NUEVA CAPA DE DIBUJO</button>
    <div id="layers-list" class="layers-list"></div>
  </div>
</div>

<input type="file" id="file-input" accept="image/*,.gif">
<div id="toast"></div>

<div id="confirm-backdrop" class="confirm-backdrop" aria-hidden="true">
  <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h3 id="confirm-title" class="confirm-title">Confirmar accion</h3>
    <p id="confirm-message" class="confirm-message">Mensaje de confirmacion</p>
    <div class="confirm-actions">
      <button id="confirm-cancel" class="prop-btn sec" type="button">Cancelar</button>
      <button id="confirm-accept" class="prop-btn danger" type="button">Eliminar</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/control/state.js"></script>
<script src="js/control/render.js"></script>
<script src="js/control/actions.js"></script>
</body>
</html>
