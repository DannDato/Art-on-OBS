<!-- ════════ CANVAS ════════ -->
<div id="canvas-wrap">

  <img
    id="canvas-overlay"

    style="
      position:absolute;
      left:50%;

      z-index:5;
      display:none;
    ">

  <textarea id="text-input-el" rows="1"></textarea>
  <div id="drop-overlay">Suelta la imagen aquí 🖼️</div>
</div>

<!-- ════════ PROPS PANEL ════════ -->
<div id="props">
  <!-- Draw props -->
  <div id="props-draw" class="prop-group">
    <h2>Pincel</h2>
    <div class="prop-row">

    <div class="prop-row">

      <span id="draw-size-val" style="min-width:24px;color:var(--muted)">8</span>
    </div>
    <button class="prop-btn sec" onclick="limpiarDibujo()">Limpiar trazos</button>
  </div>

  <!-- <div class="prop-sep"></div> -->

  <!-- Text props -->
  <div id="props-text" class="prop-group">
    <h2>Texto</h2>
    <div class="prop-row">
      <label>Color</label>

    </div>
    <div class="prop-row">
      <label>Tamaño</label>
      <input type="number" id="text-size" value="56" min="12" max="200" style="width:60px">
    </div>
  </div>

  <!-- <div class="prop-sep"></div> -->

  <!-- Selection props -->
  <div id="props-select" class="prop-group" style="display:none">
    <h2>Objeto seleccionado</h2>
    <button class="prop-btn danger" onclick="eliminarSeleccionado()">Eliminar objeto</button>

  </div>

</div>

<input type="file" id="file-input" accept="image/*,.gif">
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
let selectingArea = false; // Indica si estamos creando el recuadro de selección
let selAreaStart = { x: 0, y: 0 };
let selAreaEnd = { x: 0, y: 0 };
// ═══════════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const OVERLAY_W = 1920, OVERLAY_H = 1080;

const socket = io();
const canvas  = document.getElementById('canvas-main');
const ctx     = canvas.getContext('2d');
const wrap    = document.getElementById('canvas-wrap');
const textEl  = document.getElementById('text-input-el');

// ═══════════════════════════════════════════════════════════════════════════
// ESTADO (declarado antes de cualquier llamada a funciones)
// ═══════════════════════════════════════════════════════════════════════════
let herramienta = 'select';
let objetos = {};
let selId = null;
let pintando = false, lastX = 0, lastY = 0;
let drawStrokes = [];
let dragging = false, resizing = false;
let dragOffX = 0, dragOffY = 0;
let resizeStartX = 0, resizeStartY = 0, resizeStartW = 0, resizeStartH = 0, resizeStartOX = 0, resizeStartOY = 0;
let textPos = null;
let toastTimer;

// ─── Escalar canvas para que quepa en la ventana ──────────────────────────
const guide = document.getElementById('canvas-overlay');

function fitCanvas() {
  const maxW = wrap.clientWidth  - 32;
  const maxH = wrap.clientHeight - 32;

  const scale = Math.min(maxW / OVERLAY_W, maxH / OVERLAY_H);

  canvas.width  = OVERLAY_W;
  canvas.height = OVERLAY_H;

  canvas.style.width  = (OVERLAY_W * scale) + 'px';
  canvas.style.height = (OVERLAY_H * scale) + 'px';

  // ═════════════════════════════════════════════════════════════════════════
  // INICIALIZACIÓN COMPLETA SIN GUÍA (Al cargar)
  // ═════════════════════════════════════════════════════════════════════════
  // Si la guía no tiene un src asignado o está oculta, nos aseguramos de apagarla
  if (!guide.getAttribute('src') || guide.style.display === 'none') {
    guide.style.display = 'none';
    guide.src = '';
    // Forzamos que el botón de "Sin Guía" tenga la clase activo por código
    const btnNone = document.getElementById('guide-none');
    if (btnNone) btnNone.classList.add('activo');
  } else {
    // Si tuviera una guía activa, sí calculamos su tamaño
    guide.style.width  = canvas.style.width;
    guide.style.height = canvas.style.height;
  }

  redraw();
}


window.addEventListener('resize', fitCanvas);
fitCanvas();

function canvasScale() {
  return canvas.getBoundingClientRect().width / OVERLAY_W;
}
function toOverlay(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const s = canvasScale();
  return { x: (clientX - r.left) / s, y: (clientY - r.top) / s };
}



// ═══════════════════════════════════════════════════════════════════════════
// SOCKET
// ═══════════════════════════════════════════════════════════════════════════
socket.on('connect',    () => { document.getElementById('status').classList.remove('off'); });
socket.on('disconnect', () => { document.getElementById('status').classList.add('off'); });

// Nota: Eliminados los socket.on('trazo') individuales

socket.on('obj-add', (d) => {
  if (d.tipo === 'imagen') {
    const img = new Image();
    img.src = d.url;
    img.onload = () => { d._img = img; objetos[d.id] = d; redraw(); };
  } else {
    objetos[d.id] = d;
    redraw();
  }
});
socket.on('obj-move', ({ id, x, y }) => {
  if (objetos[id]) { objetos[id].x = x; objetos[id].y = y; redraw(); }
});
socket.on('obj-resize', ({ id, x, y, w, h }) => {
  if (objetos[id]) { Object.assign(objetos[id], { x, y, w, h }); redraw(); }
});
socket.on('obj-remove', ({ id }) => {
  delete objetos[id];
  if (selId === id) selId = null;
  redraw();
});
socket.on('limpiar-todo', () => {
  objetos = {}; selId = null; redraw();
});

// ═══════════════════════════════════════════════════════════════════════════
// REDRAW (canvas de control)
// ═══════════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════════
// REDRAW COMPLETO (Con suavizado de curvas Bézier y soporte de grupos)
// ═══════════════════════════════════════════════════════════════════════════
function redraw() {
  ctx.clearRect(0, 0, OVERLAY_W, OVERLAY_H);

  // Cuadrícula tenue de fondo
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < OVERLAY_W; x += 96) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,OVERLAY_H); ctx.stroke(); }
  for (let y = 0; y < OVERLAY_H; y += 96) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(OVERLAY_W,y); ctx.stroke(); }

  // Renderizado de Objetos (Imágenes, Textos, Trazos y Grupos)
  for (const [id, obj] of Object.entries(objetos)) {

    // 1. RENDER DE IMÁGENES
    if (obj.tipo === 'imagen' && obj._img) {
      ctx.drawImage(obj._img, obj.x, obj.y, obj.w, obj.h);
    }

    // 2. RENDER DE TEXTOS
    else if (obj.tipo === 'texto') {
      ctx.font = `900 ${obj.fontSize || 48}px 'Segoe UI', sans-serif`;
      ctx.fillStyle = obj.color || '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 0;
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#000';
      ctx.strokeText(obj.texto, obj.x, obj.y + (obj.fontSize || 48));
      ctx.fillText(obj.texto, obj.x, obj.y + (obj.fontSize || 48));
      ctx.shadowBlur = 0;
    }

    // 3. RENDER DE TRAZOS VECTORIALES SUAVIZADOS
    else if (obj.tipo === 'trazo' && obj.lineas && obj.lineas.length > 0) {
      ctx.save();
      ctx.translate(obj.x, obj.y);

      // Matriz de escala proporcional para permitir redimensionado dinámico
      let origW = obj.lineas.reduce((max, l) => Math.max(max, l.x1, l.x2), 10);
      let origH = obj.lineas.reduce((max, l) => Math.max(max, l.y1, l.y2), 10);
      ctx.scale(obj.w / origW, obj.h / origH);

      const primerTrazo = obj.lineas[0];
      ctx.globalCompositeOperation = primerTrazo.modo === 'borrar' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = primerTrazo.color;
      ctx.lineWidth = primerTrazo.grosor;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(primerTrazo.x1, primerTrazo.y1);

      // Algoritmo Chaikin / Bézier Cuadrático para promediar puntos continuos
      for (let i = 0; i < obj.lineas.length - 1; i++) {
        const curr = obj.lineas[i];
        const next = obj.lineas[i + 1];

        const midX = (curr.x2 + next.x1) / 2;
        const midY = (curr.y2 + next.y1) / 2;

        ctx.quadraticCurveTo(curr.x2, curr.y2, midX, midY);
      }

      // Conexión del último punto de la cadena vectorial
      const ultimo = obj.lineas[obj.lineas.length - 1];
      ctx.lineTo(ultimo.x2, ultimo.y2);
      ctx.stroke();

      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }

    // 4. BORDE DE SELECCIÓN (Aplica a cualquier tipo de objeto o grupo seleccionado)
    if (id === selId) {
      ctx.strokeStyle = '#7c6cfa';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 3]);
      ctx.strokeRect(obj.x - 2, obj.y - 2, obj.w + 4, obj.h + 4);
      ctx.setLineDash([]);

      // Cuadrado/Handle de redimensionado (esquina inferior derecha)
      ctx.fillStyle = '#7c6cfa';
      ctx.fillRect(obj.x + obj.w - 6, obj.y + obj.h - 6, 12, 12);
    }
  }

  // 5. RECUADRO DE SELECCIÓN MÚLTIPLE EN VIVO (Marquesina translúcida)
  if (selectingArea) {
    ctx.strokeStyle = 'rgba(124, 108, 250, 0.8)';
    ctx.fillStyle = 'rgba(124, 108, 250, 0.1)';
    ctx.lineWidth = 1;
    const widthArea = selAreaEnd.x - selAreaStart.x;
    const heightArea = selAreaEnd.y - selAreaStart.y;
    ctx.fillRect(selAreaStart.x, selAreaStart.y, widthArea, heightArea);
    ctx.strokeRect(selAreaStart.x, selAreaStart.y, widthArea, heightArea);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// HERRAMIENTAS
// ═══════════════════════════════════════════════════════════════════════════
function setTool(t) {
  herramienta = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('activo'));
  const btn = document.getElementById('tool-' + t);
  if (btn) btn.classList.add('activo');
  canvas.className = 'tool-' + t;

  // Mostrar/ocultar props
  document.getElementById('props-draw').style.display   = (t === 'draw' || t === 'eraser') ? '' : 'none';
  document.getElementById('props-text').style.display   = t === 'text' ? '' : 'none';
  document.getElementById('props-select').style.display = (t === 'select' && selId) ? '' : 'none';

  if (t !== 'select') deseleccionar();
  cerrarTextInput();
}
setTool('select'); // init

// ═══════════════════════════════════════════════════════════════════════════
// MOUSE EVENTS
// ═══════════════════════════════════════════════════════════════════════════
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup',   onUp);
canvas.addEventListener('mouseleave', onUp);

// Variable temporal para guardar las líneas del trazo actual mientras se dibuja
let trazoActualLineas = [];
let trazoMinX = Infinity, trazoMinY = Infinity, trazoMaxX = -Infinity, trazoMaxY = -Infinity;
function onDown(e) {
  const pos = toOverlay(e.clientX, e.clientY);

  if (herramienta === 'draw' || herramienta === 'eraser') {
    pintando = true;
    lastX = pos.x;
    lastY = pos.y;
    trazoActualLineas = [];
    trazoMinX = pos.x; trazoMaxX = pos.x;
    trazoMinY = pos.y; trazoMaxY = pos.y;
    return;
  }

  if (herramienta === 'select') {
    // ¿Clic en handle de resize?
    if (selId && objetos[selId]) {
      const obj = objetos[selId];
      if (pos.x >= obj.x + obj.w - 10 && pos.x <= obj.x + obj.w + 10 &&
          pos.y >= obj.y + obj.h - 10 && pos.y <= obj.y + obj.h + 10) {
        resizing = true;
        resizeStartX = pos.x; resizeStartY = pos.y;
        resizeStartW = obj.w; resizeStartH = obj.h;
        resizeStartOX = obj.x; resizeStartOY = obj.y;
        return;
      }
    }
    // ¿Clic en un objeto existente?
    const hit = hitTest(pos.x, pos.y);
    if (hit) {
      selId = hit;
      dragging = true;
      dragOffX = pos.x - objetos[hit].x;
      dragOffY = pos.y - objetos[hit].y;
      document.getElementById('props-select').style.display = '';
    } else {
      // Si hace clic en el vacío, inicia selección por recuadro múltiple
      deseleccionar();
      selectingArea = true;
      selAreaStart = { x: pos.x, y: pos.y };
      selAreaEnd = { x: pos.x, y: pos.y };
    }
    redraw();
    return;
  }

  if (herramienta === 'text') {
    abrirTextInput(pos.x, pos.y, e.clientX, e.clientY);
    return;
  }
}

function onMove(e) {
  const pos = toOverlay(e.clientX, e.clientY);

  if (pintando) {
    const color  = herramienta === 'eraser' ? '#000' : document.getElementById('draw-color').value;
    const grosor = parseInt(document.getElementById('draw-size').value);
    const modo   = herramienta === 'eraser' ? 'borrar' : 'pintar';

    // 1. Guardar localmente
    trazoActualLineas.push({ x1: lastX, y1: lastY, x2: pos.x, y2: pos.y, color, grosor, modo });

    // 2. TRANSMITIR EN VIVO: Enviamos este pequeño segmento al instante a los sockets
    socket.emit('trazo-en-vivo', { x1: lastX, y1: lastY, x2: pos.x, y2: pos.y, color, grosor, modo });

    // 3. Redibujar de forma fluida en tu pantalla
    redraw();

    if (trazoActualLineas.length > 0) {
      ctx.save();
      ctx.globalCompositeOperation = modo === 'borrar' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = color;
      ctx.lineWidth = grosor;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(trazoActualLineas[0].x1, trazoActualLineas[0].y1);

      for (let i = 0; i < trazoActualLineas.length - 1; i++) {
        const curr = trazoActualLineas[i];
        const next = trazoActualLineas[i + 1];
        const midX = (curr.x2 + next.x1) / 2;
        const midY = (curr.y2 + next.y1) / 2;
        ctx.quadraticCurveTo(curr.x2, curr.y2, midX, midY);
      }

      const ultimo = trazoActualLineas[trazoActualLineas.length - 1];
      ctx.lineTo(ultimo.x2, ultimo.y2);
      ctx.stroke();
      ctx.restore();
    }

    lastX = pos.x; lastY = pos.y;
    return;
  }

  // Si está arrastrando el recuadro de selección múltiple
  if (selectingArea) {
    selAreaEnd = { x: pos.x, y: pos.y };
    redraw();
    return;
  }

  if (dragging && selId && objetos[selId]) {
    const nx = pos.x - dragOffX, ny = pos.y - dragOffY;

    if (objetos[selId].tipo === 'grupo' && objetos[selId].hijos) {
      const dx = nx - objetos[selId].x;
      const dy = ny - objetos[selId].y;
      objetos[selId].hijos.forEach(hijo => {
        hijo.x += dx;
        hijo.y += dy;
        socket.emit('obj-move', { id: hijo.id, x: hijo.x, y: hijo.y });
      });
    }

    objetos[selId].x = nx; objetos[selId].y = ny;
    socket.emit('obj-move', { id: selId, x: nx, y: ny });
    redraw();
    return;
  }

  if (resizing && selId && objetos[selId]) {
    const dx = pos.x - resizeStartX, dy = pos.y - resizeStartY;
    const nw = Math.max(40, resizeStartW + dx);
    const nh = Math.max(40, resizeStartH + dy);

    if (objetos[selId].tipo === 'grupo' && objetos[selId].hijos) {
      const scaleX = nw / resizeStartW;
      const scaleY = nh / resizeStartH;
      objetos[selId].hijos.forEach(hijo => {
        const relX = hijo.x - resizeStartOX;
        const relY = hijo.y - resizeStartOY;
        hijo.x = resizeStartOX + (relX * scaleX);
        hijo.y = resizeStartOY + (relY * scaleY);
        hijo.w = hijo.w * scaleX;
        hijo.h = hijo.h * scaleY;
        socket.emit('obj-resize', { id: hijo.id, x: hijo.x, y: hijo.y, w: hijo.w, h: hijo.h });
      });
    }

    objetos[selId].w = nw; objetos[selId].h = nh;
    socket.emit('obj-resize', { id: selId, x: resizeStartOX, y: resizeStartOY, w: nw, h: nh });
    redraw();
    return;
  }
}

function onUp() {
  if (pintando && trazoActualLineas.length > 0) {
    // CALCULAMOS los límites fijos AQUÍ, de una sola vez cuando el trazo ya terminó.
    const xCoords = trazoActualLineas.map(l => [l.x1, l.x2]).flat();
    const yCoords = trazoActualLineas.map(l => [l.y1, l.y2]).flat();

    const finalMinX = Math.min(...xCoords);
    const finalMaxX = Math.max(...xCoords);
    const finalMinY = Math.min(...yCoords);
    const finalMaxY = Math.max(...yCoords);

    const w = finalMaxX - finalMinX;
    const h = finalMaxY - finalMinY;

    // Normalizamos con los valores estáticos recién calculados
    const lineasNormalizadas = trazoActualLineas.map(l => ({
      x1: l.x1 - finalMinX,
      y1: l.y1 - finalMinY,
      x2: l.x2 - finalMinX,
      y2: l.y2 - finalMinY,
      color: l.color,
      grosor: l.grosor,
      modo: l.modo
    }));

    const id = 'stroke_' + Date.now();
    socket.emit('obj-add', {
      id,
      tipo: 'trazo',
      x: finalMinX,
      y: finalMinY,
      w: Math.max(10, w),
      h: Math.max(10, h),
      lineas: lineasNormalizadas
    });
  }

  if (selectingArea) {
    selectingArea = false;
    const xMin = Math.min(selAreaStart.x, selAreaEnd.x);
    const xMax = Math.max(selAreaStart.x, selAreaEnd.x);
    const yMin = Math.min(selAreaStart.y, selAreaEnd.y);
    const yMax = Math.max(selAreaStart.y, selAreaEnd.y);

    let capturados = [];
    for (const [id, obj] of Object.entries(objetos)) {
      if (obj.tipo === 'grupo') continue;
      const centerXX = obj.x + (obj.w / 2);
      const centerYY = obj.y + (obj.h / 2);
      if (centerXX >= xMin && centerXX <= xMax && centerYY >= yMin && centerYY <= yMax) {
        capturados.push(obj);
      }
    }

    if (capturados.length > 1) {
      const gMinX = Math.min(...capturados.map(o => o.x));
      const gMaxX = Math.max(...capturados.map(o => o.x + o.w));
      const gMinY = Math.min(...capturados.map(o => o.y));
      const gMaxY = Math.max(...capturados.map(o => o.y + o.h));

      const grupoId = 'group_' + Date.now();
      socket.emit('obj-add', {
        id: grupoId,
        tipo: 'grupo',
        x: gMinX,
        y: gMinY,
        w: gMaxX - gMinX,
        h: gMaxY - gMinY,
        hijos: capturados
      });
      selId = grupoId;
      document.getElementById('props-select').style.display = '';
    }
  }

  pintando = false; dragging = false; resizing = false;
  redraw();
}
// ═══════════════════════════════════════════════════════════════════════════
// HIT TEST
// ═══════════════════════════════════════════════════════════════════════════
function hitTest(x, y) {
  // Último objeto encima primero
  const ids = Object.keys(objetos).reverse();
  for (const id of ids) {
    const o = objetos[id];
    if (x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h) return id;
  }
  return null;
}

// ═══════════════════════════════════════════════════════════════════════════
// TEXTO INLINE
// ═══════════════════════════════════════════════════════════════════════════
function abrirTextInput(ox, oy, cx, cy) {
  const r = canvas.getBoundingClientRect();
  const s = canvasScale();
  textPos = { x: ox, y: oy };

  textEl.style.display = 'block';
  textEl.style.left = (cx - r.left) + 'px';
  textEl.style.top  = (cy - r.top)  + 'px';
  textEl.style.fontSize = (parseInt(document.getElementById('text-size').value) * s) + 'px';
  textEl.style.color = document.getElementById('text-color').value;
  textEl.value = '';

  setTimeout(() => {
    textEl.focus();
  }, 50);
}

function cerrarTextInput() {
  textEl.style.display = 'none';
  textEl.value = '';
  textPos = null;
}

textEl.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { cerrarTextInput(); return; }

  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const texto = textEl.value.trim();

    if (texto && textPos) {
      const fontSize = parseInt(document.getElementById('text-size').value);
      const color    = document.getElementById('text-color').value;
      const id = 'txt_' + Date.now();
      const w  = Math.max(200, texto.length * fontSize * 0.6);
      const h  = fontSize * 1.5;

      socket.emit('obj-add', { id, tipo: 'texto', texto, x: textPos.x, y: textPos.y, w, h, color, fontSize });
      toast('💬 Texto agregado');
    }

    cerrarTextInput();

    // ═════════════════════════════════════════════════════════════════════════
    // CAMBIO AUTOMÁTICO A SELECCIÓN
    // ═════════════════════════════════════════════════════════════════════════
    setTool('select');
  }
});

// Auto-resize textarea
textEl.addEventListener('input', () => {
  textEl.style.height = 'auto';
  textEl.style.height = textEl.scrollHeight + 'px';
});

// ═══════════════════════════════════════════════════════════════════════════
// IMÁGENES — upload + drag & drop
// ═══════════════════════════════════════════════════════════════════════════
document.getElementById('file-input').addEventListener('change', function() {
  if (this.files[0]) subirImagen(this.files[0]);
});

function triggerUpload() {
  document.getElementById('file-input').click();
}

async function subirImagen(file) {
  const form = new FormData();
  form.append('imagen', file);
  const res  = await fetch('/upload', { method: 'POST', body: form });
  const data = await res.json();
  if (!data.ok) return;

  const id  = 'img_' + Date.now();
  const url = data.url;
  // Tamaño por defecto razonable en el overlay
  socket.emit('obj-add', { id, tipo: 'imagen', url, x: 200, y: 200, w: 400, h: 300 });
  toast('🖼️ Imagen enviada');
  setTool('select');
}

// Drag & drop en canvas-wrap
const dropZone = document.getElementById('canvas-wrap');
const dropOverlay = document.getElementById('drop-overlay');

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropOverlay.style.display = 'flex';
});
dropZone.addEventListener('dragleave', () => {
  dropOverlay.style.display = 'none';
});
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropOverlay.style.display = 'none';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) subirImagen(file);
});

// ═══════════════════════════════════════════════════════════════════════════
// SELECCIÓN / ELIMINACIÓN
// ═══════════════════════════════════════════════════════════════════════════
function deseleccionar() {
  selId = null;
  document.getElementById('props-select').style.display = 'none';
  redraw();
}

function eliminarSeleccionado() {
  if (!selId) return;

  const obj = objetos[selId];

  // Si es un grupo, borrar primero a todos sus hijos del servidor
  if (obj.tipo === 'grupo' && obj.hijos) {
    obj.hijos.forEach(hijo => {
      socket.emit('obj-remove', { id: hijo.id, url: hijo.url, tipo: hijo.tipo });
    });
  }

  // Enviamos el ID, el tipo y la URL al servidor para que sepa si debe borrar del disco
  socket.emit('obj-remove', { id: selId, url: obj.url, tipo: obj.tipo });
  toast('🗑️ Objetos eliminados');
}

// ═══════════════════════════════════════════════════════════════════════════
// LIMPIAR
// ═══════════════════════════════════════════════════════════════════════════
function limpiarDibujo() {
  for (const id in objetos) {
    if (objetos[id].tipo === 'trazo') {
      socket.emit('obj-remove', { id });
    }
  }
  toast('🧹 Trazos limpiados');
}
function limpiarTodo() {
  if (!confirm('¿Limpiar TODO el overlay?')) return;
  socket.emit('limpiar-todo');
  toast('🧨 Overlay limpiado');
}

// ═══════════════════════════════════════════════════════════════════════════
// GESTOR DE CANVA GUIDES
// ═══════════════════════════════════════════════════════════════════════════
function cambiarGuia(nombreArchivo) {
  const guideEl = document.getElementById('canvas-overlay');

  // Limpiar el estado activo SOLO de los botones de guía
  document.querySelectorAll('.guide-btn').forEach(b => b.classList.remove('activo'));

  if (nombreArchivo === 'none') {
    guideEl.style.display = 'none';
    guideEl.src = '';
    document.getElementById('guide-none').classList.add('activo');
  } else {
    guideEl.src ="img/" + nombreArchivo;
    guideEl.style.display = 'block';

    if (nombreArchivo === 'canva-guide.png')  document.getElementById('guide-1').classList.add('activo');
    if (nombreArchivo === 'canva-guide2.png') document.getElementById('guide-2').classList.add('activo');
    if (nombreArchivo === 'canva-guide3.png') document.getElementById('guide-3').classList.add('activo');
  }

  fitCanvas();
}


// ═══════════════════════════════════════════════════════════════════════════
// ATAJOS DE TECLADO (TECLAS RÁPIDAS)
// ═══════════════════════════════════════════════════════════════════════════
window.addEventListener('keydown', (e) => {
  // Ignorar atajos si el usuario está escribiendo en un input o textarea
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    return;
  }

  const key = e.key.toLowerCase();

  // CTRL + SUPR -> Limpiar todo
  if (e.ctrlKey && (e.key === 'Delete' || e.key === 'Supr')) {
    e.preventDefault();
    limpiarTodo();
    return;
  }

  // SUPR o BACKSPACE -> Eliminar objeto seleccionado
  if (e.key === 'Delete' || e.key === 'Supr' || e.key === 'Backspace') {
    e.preventDefault();
    eliminarSeleccionado();
    return;
  }

  // Atajos de herramientas de una sola tecla
  switch (key) {
    case 'v':
      setTool('select');
      break;
    case 'p':
    case 'c':
    case 'l':
      setTool('draw');
      break;
    case 'b':
    case 'e':
      setTool('eraser');
      break;
    case 'i':
    case 'f':
      triggerUpload();
      break;
    case 't':
      setTool('text');
      break;
  }
});

// ═══════════════════════════════════════════════════════════════════════════
// SLIDERS UI
// ═══════════════════════════════════════════════════════════════════════════
document.getElementById('draw-size').addEventListener('input', function() {
  document.getElementById('draw-size-val').textContent = this.value;
});


// ═══════════════════════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════════════════════
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// Init props visibility
setTool('select');
</script>
